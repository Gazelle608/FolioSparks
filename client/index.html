<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>FolioSparks — Serialized fiction that pays its authors directly</title>
    <meta
      name="description"
      content="A digital library for serialized novels. Readers spend Sparks on the chapters that hit hardest, vote on what happens next, and donate straight to the author's own Ko-fi or Patreon."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="FolioSparks — Serialized fiction that pays its authors directly" />
    <meta
      property="og:description"
      content="Readers spend Sparks on the chapters that hit hardest. Authors get paid directly. No middlemen."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://foliosparks.com" />
    <meta property="og:site_name" content="FolioSparks" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FolioSparks" />
    <meta name="twitter:description" content="Serialized fiction that pays its authors directly." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme color — matches celestial navy -->
    <meta name="theme-color" content="#0A0F2C" />

    <!-- Force light theme before React mounts — prevents FOUC -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme = "light";
          document.documentElement.classList.remove("dark");
          // Clear any stored preference from previous palettes
          localStorage.removeItem("foliosparks:theme");
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="no-tap-highlight">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
