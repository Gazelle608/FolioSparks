<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#051F20"/>
      <stop offset="55%" stop-color="#0B2B26"/>
      <stop offset="100%" stop-color="#235347"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8EB69B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8EB69B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FFD966" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD966" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#grad)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Subtle sparkles -->
  <g fill="#DAF1DE" opacity="0.15">
    <circle cx="320"  cy="180" r="1.5"/>
    <circle cx="880"  cy="120" r="2"/>
    <circle cx="1420" cy="240" r="1.5"/>
    <circle cx="1660" cy="560" r="2"/>
    <circle cx="240"  cy="780" r="1.5"/>
    <circle cx="1080" cy="880" r="2"/>
    <circle cx="1560" cy="920" r="1.5"/>
  </g>
</svg>